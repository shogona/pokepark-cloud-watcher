name: チケット取得の検証
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 検証する標準サーバー
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run check
      - if: runner.os == 'macOS'
        run: npm run check
